[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "articulate"
version = "0.1.0"
description = "Turn any text into a voice-cloned narrated video with word-level captions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Articulate Contributors"},
]
keywords = ["tts", "voice-cloning", "video", "captions", "chatterbox", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "chatterbox-tts",
    "whisper-timestamped",
    "moviepy>=2.0",
    "Pillow>=10.0",
    "numpy",
    "torch",
    "torchaudio",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
articulate = "articulate.cli:main"

[project.urls]
Homepage = "https://github.com/laloquidity/articulate"
Repository = "https://github.com/laloquidity/articulate"
Issues = "https://github.com/laloquidity/articulate/issues"

[tool.setuptools.packages.find]
include = ["articulate*"]
